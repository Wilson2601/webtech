<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EDUTECH - Academic Access</title>
    <!-- Critical: This links to your CSS in the static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav style="display: flex; justify-content: space-between; padding: 20px 50px; background: rgba(0,0,0,0.8);">
            <div style="font-weight: bold; color: white;">EDUTECH</div>
            <div class="nav-links">
                <a href="/" style="color: #888; margin: 0 15px; text-decoration: none;">HOME</a>
                <a href="/courses" style="color: #888; margin: 0 15px; text-decoration: none;">COURSES</a>
                <a href="/bookstore" style="color: #888; margin: 0 15px; text-decoration: none;">BOOKSTORE</a>
                <a href="/portal" style="color: white; margin: 0 15px; text-decoration: none;">PORTAL</a>
                <a href="/forum" style="color: #888; margin: 0 15px; text-decoration: none;">FORUM</a>
            </div>
            <div style="color: white;">LOGIN</div>
        </nav>
    </header>

    <div style="max-width: 400px; margin: 80px auto; text-align: left; color: white;">
        <h1 style="font-style: italic; font-size: 32px; margin-bottom: 5px;">Sign In</h1>
        <p style="color: #666; font-size: 10px; letter-spacing: 2px; margin-bottom: 30px;">ACADEMIC ACCOUNT ACCESS</p>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <input type="text" name="email" placeholder="Student ID / Email" required 
                   style="width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
            <input type="password" name="password" placeholder="Password" required 
                   style="width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
            <p style="font-size: 11px; color: #444; cursor: pointer;">FORGOT PASSWORD?</p>
            
            <button type="submit" style="width: 100%; padding: 15px; border-radius: 25px; border: none; background: white; color: black; font-weight: bold; cursor: pointer; margin-top: 20px;">
                SIGN IN
            </button>
        </form>

        <!-- Hidden/Separate Register Section -->
        <div id="register-form" style="margin-top: 100px; border-top: 1px solid #222; pt: 50px;">
            <h1 style="font-style: italic;">Register</h1>
            <form action="/register" method="POST">
                <input type="text" name="email" placeholder="Student ID / Email" required 
                       style="width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
                <input type="password" name="password" placeholder="Password" required 
                       style="width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
                <button type="submit" style="width: 100%; padding: 15px; border-radius: 25px; border: none; background: #a855f7; color: white; font-weight: bold; cursor: pointer;">
                    CREATE ACCOUNT
                </button>
            </form>
        </div>
    </div>
</body>
</html>
